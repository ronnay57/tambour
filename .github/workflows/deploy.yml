# Construit le site avec Vite et le publie sur GitHub Pages à chaque fusion sur main.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un nouveau push n'annule pas celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has-app: ${{ steps.check.outputs.has-app }}
    steps:
      - uses: actions/checkout@v4

      # Tant que l'application n'existe pas encore (pas de package.json), on ne déploie rien.
      - id: check
        run: echo "has-app=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.has-app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - if: steps.check.outputs.has-app == 'true'
        name: Installer les dépendances
        run: npm ci

      - if: steps.check.outputs.has-app == 'true'
        name: Construire le site
        run: npm run build

      - if: steps.check.outputs.has-app == 'true'
        uses: actions/configure-pages@v5

      - if: steps.check.outputs.has-app == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.has-app == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
