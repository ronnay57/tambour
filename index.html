<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ecdf" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#120f0d" media="(prefers-color-scheme: dark)" />
    <title>Tambour</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1 class="brand">Tambour<span class="brand__dot" aria-hidden="true"></span></h1>
        <p class="topbar__hint" id="hint">Frappe une pièce, au doigt, à la souris ou au clavier</p>
        <button
          id="theme-toggle"
          class="btn btn--icon"
          type="button"
          aria-label="Changer de thème"
        ></button>
      </header>

      <main id="stage" class="stage">
        <div id="drum-kit" class="drum-kit" role="group" aria-label="Kit de batterie"></div>
      </main>

      <!-- Zone réservée aux contrôles tempo, boucles, lecture et enregistrement. -->
      <section id="transport" class="transport" aria-label="Contrôles"></section>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
